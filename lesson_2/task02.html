<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="css/style.css">
	<title>Task 2</title>
</head>
<body>
	<main class="page-task02">
		<section class="page-task02__section solution">
			<div class="solution__container">
				<div class="task-list__list list ">
					<a target="_blank" href="task02.html" class="list__link">
						<h2 class="list__title">Задача 2</h2>
						<p>
							Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.
						</p>
					</a>
				</div>
				<script>
					"use strict"
					//Задача 2: Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.
					//1. Введення даних: рік народження
					let birthYear = parseInt(prompt('Будь ласка, введіть рік народження', '1920')); //рік народження
					const CURRENT_YEAR = 2026;

					//2. Обчислення кількості років
					let age = CURRENT_YEAR - birthYear;

					//3. Виведення результату на сторінку
					document.write(`
						<div class="solution__list list ">
							<div class="list__item">
								<h2 class="list__title">Результати:</h2>
								<p>Вік: ${age}</p>
							</div>
						</div>
					`);
				</script>
			</div>
		</section>
	</main>
</body>
</html>
